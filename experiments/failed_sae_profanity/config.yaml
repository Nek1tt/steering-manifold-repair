model:
  name: gpt2
  device: auto
  dtype: float32

sae:
  location: resid_post_mlp
  layer: 8
  width: 128k
  feature_id: 64840
  feature_label: profanity_predictor_1

steering:
  hook_name: blocks.8.hook_resid_post
  strength_mode: sae_alpha
  strengths: [0.0, 4.0, 8.0, 16.0, 24.0, 32.0, 48.0, 64.0]
  repair: identity

sampling:
  max_new_tokens: 64
  temperature: 0.9
  top_p: 0.95
  seeds: [11, 23]

experiment:
  prompts_path: data/prompts.txt
  calibration_prompts_path: data/calibration_prompts.txt
  concept_metric: profanity_any_pct
  output_csv: results/baseline_samples.csv
  save_every: 1
  min_concept_gain: 5.0
