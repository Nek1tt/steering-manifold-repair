model:
  name: gpt2
  device: auto
  dtype: float32

vector:
  layer: 6
  hook_name: blocks.6.hook_resid_post
  cache_path: results/sentiment_direction.pt

judge:
  model_name: distilbert-base-uncased-finetuned-sst-2-english
  batch_size: 32

# model_directional_jvp читает численные JVP-настройки из этой секции.
# Значения скопированы из frozen JRR experiment и не перенастраиваются.
jrr:
  diagnostic:
    jvp_mode: autograd
    fallback_to_finite_difference: true
    finite_difference_epsilon: 0.01

selective_jrr:
  output_dir: results/selective_jrr
  source_hook: blocks.6.hook_resid_post

  # Зафиксировано по Experiment 007 до оценки нового метода.
  target_hook: blocks.7.hook_resid_post

  # Beta sweep отсутствует: проверяется именно mode selection, а не tuning
  # величины correction после просмотра результата full JRR.
  beta: 1.0
  positive_only: true

  # Только описательная frontier-диагностика; основной criterion — same-alpha gate.
  concept_thresholds: [70, 75, 80]

  calibration:
    prompts_path: data/calibration_prompts.txt
    max_prompts: 8
    methods: [additive, jrr_orth, kl_jrr]
    strengths: [0.0, 1.0, 1.5, 2.0, 2.25, 3.0, 4.0]
    seeds: [37]
    max_new_tokens: 32
    temperature: 0.9
    top_p: 0.95

    # Gate заморожен до открытия нового held-out: хотя бы в одной strong point
    # требуется +5 fluency к additive при потере не более 5 concept points.
    strong_strengths: [2.25, 3.0, 4.0]
    gate_min_fluency_gain: 5.0
    gate_max_concept_loss: 5.0

  # Новый held-out создан только после анализа Experiment 007. Здесь проверяется
  # ровно strong-steering regime, который мотивировал selective repair; full JRR
  # остаётся прямым causal control.
  evaluation:
    prompts_path: data/selective_jrr_heldout_prompts.txt
    max_prompts: 12
    methods: [additive, jrr_orth, kl_jrr]
    strengths: [0.0, 2.25, 3.0, 4.0]
    seeds: [101, 211]
    max_new_tokens: 32
    temperature: 0.9
    top_p: 0.95
