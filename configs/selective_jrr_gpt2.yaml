model:
  name: gpt2
  device: auto
  dtype: float32

vector:
  layer: 6
  hook_name: blocks.6.hook_resid_post
  cache_path: results/sentiment_direction.pt

judge:
  model_name: distilbert-base-uncased-finetuned-sst-2-english
  batch_size: 32

# model_directional_jvp currently reads numerical JVP settings from this section.
# These values are copied from the frozen JRR experiment and are not retuned.
jrr:
  diagnostic:
    jvp_mode: autograd
    fallback_to_finite_difference: true
    finite_difference_epsilon: 0.01

selective_jrr:
  output_dir: results/selective_jrr
  source_hook: blocks.6.hook_resid_post

  # Frozen from Experiment 007 before this method is evaluated.
  target_hook: blocks.7.hook_resid_post

  # No beta sweep: the scientific question is whether mode selection, not
  # correction magnitude tuning, fixes the full-JRR semantic failure.
  beta: 1.0
  positive_only: true

  # Descriptive only. The primary decision criterion is the same-alpha gate.
  concept_thresholds: [70, 75, 80]

  calibration:
    prompts_path: data/calibration_prompts.txt
    max_prompts: 8
    methods: [additive, jrr_orth, kl_jrr]
    strengths: [0.0, 1.0, 1.5, 2.0, 2.25, 3.0, 4.0]
    seeds: [37]
    max_new_tokens: 32
    temperature: 0.9
    top_p: 0.95

    # Frozen before the new held-out is opened. KL-JRR must recover at least
    # five fluency points over additive while losing no more than five concept
    # points at one strong-steering operating point.
    strong_strengths: [2.25, 3.0, 4.0]
    gate_min_fluency_gain: 5.0
    gate_max_concept_loss: 5.0

  # NEW hold-out created only after Experiment 007 was analyzed. We evaluate
  # exactly the strong-steering regime that motivated selective repair, and keep
  # full JRR as a direct causal control. This is both cheaper and more decisive
  # than another broad alpha sweep.
  evaluation:
    prompts_path: data/selective_jrr_heldout_prompts.txt
    max_prompts: 12
    methods: [additive, jrr_orth, kl_jrr]
    strengths: [0.0, 2.25, 3.0, 4.0]
    seeds: [101, 211]
    max_new_tokens: 32
    temperature: 0.9
    top_p: 0.95
