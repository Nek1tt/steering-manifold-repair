model:
  name: gpt2
  device: auto
  dtype: float32

vector:
  layer: 6
  hook_name: blocks.6.hook_resid_post
  cache_path: results/sentiment_direction.pt

activation_cache:
  path: results/smoke_layer6_generic_activations.pt
  dataset_name: wikitext
  dataset_config: wikitext-2-raw-v1
  split: train
  text_field: text
  max_texts: 500
  batch_size: 16
  max_seq_tokens: 96
  max_activations: 8000
  min_chars: 40
  token_stride: 2
  val_fraction: 0.10
  seed: 1234

training:
  device: auto
  hidden_dim: 768
  batch_size: 256
  epochs: 1
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  ratio_min: 0.02
  ratio_max: 3.0
  structured_probability: 0.5
  identity_probability: 0.05
  seed: 2026
  num_workers: 0

denoisers:
  gaussian:
    checkpoint: checkpoints/smoke_denoiser_gaussian.pt
    history: results/smoke_denoiser_gaussian_history.json
    required: true
  mixed:
    checkpoint: checkpoints/smoke_denoiser_mixed.pt
    history: results/smoke_denoiser_mixed_history.json
    required: true

judge:
  model_name: distilbert-base-uncased-finetuned-sst-2-english
  batch_size: 32

evaluation:
  prompts_path: data/calibration_prompts.txt
  strengths: [0.0, 1.0, 2.0]
  seeds: [11]
  max_new_tokens: 32
  temperature: 0.9
  top_p: 0.95
  methods:
    - additive
    - gaussian
    - gaussian_dpar
    - mixed
    - mixed_dpar
  output_csv: results/smoke_repair_suite_samples.csv
  output_dir: results/smoke_repair_suite
  save_every: 1
