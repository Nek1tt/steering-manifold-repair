model:
  name: gpt2
  device: auto
  dtype: float32

vector:
  layer: 6
  hook_name: blocks.6.hook_resid_post
  cache_path: results/sentiment_direction.pt

activation_cache:
  path: results/retrain_layer6_generic_activations.pt
  dataset_name: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  split: train
  text_field: text
  max_texts: 3000
  batch_size: 16
  max_seq_tokens: 128
  max_activations: 80000
  min_chars: 40
  token_stride: 1
  val_fraction: 0.10
  seed: 1234
  streaming: true

training:
  device: auto
  hidden_dim: 1536
  batch_size: 512
  epochs: 5
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  ratio_min: 0.02
  ratio_max: 3.0
  structured_probability: 0.5
  identity_probability: 0.05
  seed: 2026
  num_workers: 0

denoisers:
  gaussian:
    checkpoint: checkpoints/retrained_denoiser_gaussian.pt
    history: results/retrained_denoiser_gaussian_history.json
    required: true

judge:
  model_name: distilbert-base-uncased-finetuned-sst-2-english
  batch_size: 32

followup:
  output_dir: results/retrained_inference_followups

  # Намеренно переобучается только Gaussian denoiser. Mixed/structured model
  # не улучшил downstream Pareto frontier, поэтому его повторный retrain не нужен
  # для этой сфокусированной проверки correction magnitude и DPAR geometry.
  gaussian_vanilla_betas: [0.25, 0.50, 0.75, 1.00]
  gaussian_dpar_betas: [0.10, 0.25, 0.50, 0.75, 1.00]
  mixed_dpar_betas: []

  concept_thresholds: [80, 85, 90, 95]

  calibration:
    prompts_path: data/calibration_prompts.txt
    # alpha=0 нужен как общий fluency anchor для aggregate_repairs.
    strengths: [0.0, 0.75, 1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 3.00]
    seeds: [37]
    max_new_tokens: 48
    temperature: 0.9
    top_p: 0.95
    save_every: 1

  evaluation:
    prompts_path: data/prompts.txt
    # alpha=0 нужен как общий fluency anchor для aggregate_repairs.
    strengths: [0.0, 0.75, 1.00, 1.25, 1.50, 1.75, 2.00, 2.25, 2.50, 3.00]
    seeds: [11, 23]
    max_new_tokens: 64
    temperature: 0.9
    top_p: 0.95
    save_every: 1
